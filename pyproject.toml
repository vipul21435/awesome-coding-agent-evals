[project]
name = "awesome-coding-agent-evals"
version = "0.1.0"
description = "Curated list of benchmarks, harnesses, datasets and papers for evaluating coding agents"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vipul Raj Jha" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["render", "validate", "recheck"]
