name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate data and README
        run: uv run python scripts/validate.py
      - name: Check README is rendered from the data
        run: uv run python scripts/render.py --check
      - name: Tests
        run: uv run pytest -q
